server {
    # The indexer stores whole documents with their embeddings in one request.
    client_max_body_size 64m;

    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service.
    # The upstream is held in a variable so nginx resolves it at request time
    # rather than at startup - otherwise this container fails to boot whenever
    # the server container is not up yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://server:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
