services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./vector-db/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  generating:
    build:
      context: .
      dockerfile: generating/Dockerfile
      args:
        RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-cross-encoder/ms-marco-MiniLM-L-6-v2}
    ports:
      - "8000:8000"
    volumes:
      - ./vector-db:/app/vector-db
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GITLAB_PAT  # Imported if declared in shell
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./chat-app
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://generating:8000
    environment:
      - BACKEND_URL=http://generating:8000
    ports:
      - "3000:3000"
    depends_on:
      - generating
    restart: unless-stopped

volumes:
  qdrant_storage:
